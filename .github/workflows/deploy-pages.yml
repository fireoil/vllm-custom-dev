name: Deploy Tutorial Pages
# 触发：网页版目录或本文件变更；亦可在 Actions 页手动触发

on:
  push:
    branches: [main]
    paths:
      - "vllm_定制开发教程/可视化网页版/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 注意：Pages 需在仓库 Settings → Pages → Source 选 "GitHub Actions" 一次性开启
      # 页面全部使用相对路径，无需 configure-pages 获取 baseURL
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "vllm_定制开发教程/可视化网页版"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
