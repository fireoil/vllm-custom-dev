name: Deploy Tutorial Pages

on:
  push:
    branches: [main]
    paths:
      - "vllm_定制开发教程/可视化网页版/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 自动为仓库开启 GitHub Pages（build_type=workflow），已开启则跳过
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "vllm_定制开发教程/可视化网页版"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
